<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12508F">
  <title>SignBridge : patient</title>
  <link rel="icon" href="brand/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="brand/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" href="brand/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="screen screen--patient">

<header class="bar">
  <p class="bar__brand"><img class="brand__logo" src="brand/logo-header.webp" alt="" width="72" height="44"><span class="brand">SignBridge</span> <span class="bar__room" id="room-name"></span></p>
  <p class="bar__link bi bi--end" id="link-status" aria-live="polite">
    <span class="ar" lang="ar" dir="rtl">جارٍ الاتصال</span>
    <span>Connexion…</span>
  </p>
</header>

<main class="patient">

  <!-- The camera with the skeleton drawn over it. A demonstration video is never
       shown: it plays invisibly (still rendered, so the tracker gets its frames)
       and only its skeleton is drawn. -->
  <section class="stage" id="stage" data-view="loading" data-hand="none" aria-label="Caméra">
    <video class="stage__media" id="cam" playsinline muted autoplay hidden></video>
    <video class="stage__media stage__media--masked" id="clip" playsinline muted preload="auto" hidden aria-hidden="true"></video>
    <canvas class="stage__media" id="overlay" aria-hidden="true"></canvas>

    <p class="pill stage__pill bi" id="hand-pill">
      <span class="ar" lang="ar" dir="rtl"></span>
      <span></span>
    </p>
    <p class="stage__tag bi" id="clip-tag" hidden>
      <span class="ar" lang="ar" dir="rtl"></span>
      <span></span>
    </p>

    <div class="stage__panel stage__panel--loading">
      <p class="bi bi--center" id="loading-text">
        <span class="ar" lang="ar" dir="rtl">جارٍ التحميل</span>
        <span>Chargement</span>
      </p>
    </div>

    <div class="stage__panel stage__panel--idle">
      <button type="button" class="btn btn--primary btn--big bi bi--center" id="btn-start">
        <span class="ar" lang="ar" dir="rtl">شغّل الكاميرا</span>
        <span>Démarrer la caméra</span>
      </button>
    </div>

    <div class="stage__panel stage__panel--error" role="alert">
      <p class="stage__message bi bi--center">
        <span class="ar" lang="ar" dir="rtl" id="error-ar"></span>
        <span id="error-fr"></span>
      </p>
      <button type="button" class="btn btn--light bi bi--center" id="btn-retry">
        <span class="ar" lang="ar" dir="rtl" id="retry-ar">أعد تحميل الصفحة</span>
        <span id="retry-fr">Recharger la page</span>
      </button>
    </div>
  </section>

  <!-- The sentence being built, sign after sign. -->
  <section class="compose" aria-label="Votre phrase">
    <div class="words" id="words"></div>
    <div class="preview">
      <p class="preview__label bi">
        <span class="ar" lang="ar" dir="rtl">سيقرأ الطبيب</span>
        <span>Le médecin lira</span>
      </p>
      <p class="preview__ar ar" lang="ar" dir="rtl" id="preview-ar"></p>
      <p class="preview__fr" id="preview-fr"></p>
    </div>
    <div class="actions">
      <button type="button" class="btn btn--erase bi bi--center" id="btn-clear" disabled>
        <span class="ar" lang="ar" dir="rtl">مسح</span>
        <span>Effacer</span>
      </button>
      <button type="button" class="btn btn--send bi bi--center" id="btn-send" disabled>
        <span class="ar" lang="ar" dir="rtl">إرسال</span>
        <span>Envoyer</span>
      </button>
    </div>
  </section>

  <!-- The doctor's last message: the text, and a stick figure making the signs one after another. -->
  <section class="reply" id="reply" data-state="empty" aria-label="Message du médecin">
    <div class="reply__head">
      <h2 class="reply__title bi">
        <span class="ar" lang="ar" dir="rtl">الطبيب</span>
        <span>Le médecin</span>
      </h2>
      <p class="pill pill--busy bi bi--end" id="doctor-activity" hidden>
        <span class="ar" lang="ar" dir="rtl"></span>
        <span></span>
      </p>
    </div>
    <p class="reply__empty bi">
      <span class="ar" lang="ar" dir="rtl">رسائل الطبيب تظهر هنا</span>
      <span>Les messages du médecin s'affichent ici</span>
    </p>
    <p class="reply__text" id="reply-text" aria-live="polite"></p>
    <div class="reply__signs" id="reply-signs">
      <div class="reply__screen">
        <canvas class="reply__figure" id="reply-figure" aria-hidden="true"></canvas>
      </div>
      <div class="reply__below">
        <p class="reply__name bi" id="reply-name">
          <span class="ar" lang="ar" dir="rtl"></span>
          <span></span>
        </p>
        <p class="reply__count" id="reply-count"></p>
        <button type="button" class="btn btn--quiet bi bi--center" id="btn-replay">
          <span class="ar" lang="ar" dir="rtl">أعد العرض</span>
          <span>Revoir</span>
        </button>
      </div>
    </div>
  </section>

  <!-- The last few messages, words only. -->
  <section class="history" aria-labelledby="history-title">
    <h2 class="history__title bi" id="history-title">
      <span class="ar" lang="ar" dir="rtl">المحادثة</span>
      <span>Conversation</span>
    </h2>
    <ol class="history__list" id="history"></ol>
  </section>

  <!-- For a presenter without a signer: a reference video goes through the same pipeline as the camera. -->
  <section class="demo" aria-labelledby="demo-title">
    <h2 class="demo__title" id="demo-title">Démonstration sans signeur</h2>
    <div class="demo__row">
      <label class="vh" for="demo-sign">Signe à faire signer par la vidéo</label>
      <select class="demo__select" id="demo-sign" disabled></select>
      <button type="button" class="btn btn--quiet btn--small" id="btn-demo" disabled>Faire signer la vidéo</button>
    </div>
  </section>

  <p class="vh" id="announce" aria-live="polite"></p>
</main>

<noscript><p class="noscript">Cette page a besoin de JavaScript. Activez-le, puis rechargez la page.</p></noscript>
<script>
  // If patient.js cannot start at all (page opened as a file, very old browser),
  // say so in the camera area instead of leaving "Chargement" up forever.
  window.setTimeout(function () {
    if (window.__signbridgeBooted) return;
    var fr = location.protocol === "file:"
      ? "La page est ouverte comme un fichier : lancez le serveur local (python3 web/serve.py), puis ouvrez son adresse."
      : "L'application n'a pas démarré : mettez le navigateur à jour, puis rechargez la page.";
    document.getElementById("error-ar").textContent = "التطبيق لم يشتغل: أعد تحميل الصفحة.";
    document.getElementById("error-fr").textContent = fr;
    document.getElementById("btn-retry").onclick = function () { location.reload(); };
    document.getElementById("stage").setAttribute("data-view", "error");
  }, 5000);
</script>
<script type="module" src="patient.js"></script>
</body>
</html>
