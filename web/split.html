<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#12508F">
  <title>SignBridge : patient et médecin</title>
  <link rel="icon" href="brand/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="icon" href="brand/favicon-48.png" sizes="48x48" type="image/png">
  <link rel="apple-touch-icon" href="brand/icon-180.png">
  <link rel="stylesheet" href="style.css">
</head>
<body class="split">
  <!-- src is set below, once the room is known, so neither screen loads twice. -->
  <iframe class="split__pane" id="pane-patient" title="Écran du patient" allow="camera; microphone; autoplay"></iframe>
  <iframe class="split__pane" id="pane-doctor" title="Écran du médecin" allow="camera; microphone; autoplay"></iframe>
  <noscript><p class="noscript">Cette page a besoin de JavaScript. Activez-le, puis rechargez la page.</p></noscript>
  <script>
    // Both panes join the room named in ?room=, or a new room (four digits), checked like the relay checks it.
    (function () {
      var asked = new URLSearchParams(location.search).get("room");
      var room = asked && /^[A-Za-z0-9_-]{1,32}$/.test(asked) ? asked : String(1000 + Math.floor(Math.random() * 9000));
      if (room !== asked) history.replaceState(null, "", "?room=" + room);
      var query = "?room=" + encodeURIComponent(room);
      document.getElementById("pane-patient").src = "patient.html" + query;
      document.getElementById("pane-doctor").src = "doctor.html" + query;
      document.title = "SignBridge : salle " + room;
    })();
  </script>
</body>
</html>
